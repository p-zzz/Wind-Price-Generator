generator:
  horizon_hours: 43800          # simulation length in hours (43800 = 5 years)
  n_paths: 1                    # number of independent stochastic paths to draw
  random_seed: 42
  block_size: 168               # bootstrap block length for load/net-position (hours)
  bootstrap_window_days: 14     # blocks are drawn from the same local hour-of-day and
                                 # a day-of-year within +/- this many days of the hour
                                 # they fill, so load keeps its season and daily cycle
  start_date: "2024-01-01"      # first timestamp of the output CSV -- match this to
                                 # WinPACT's Project_StartDate (or your own tool's COD)
                                 # so the two timelines line up hour-for-hour

wind:
  scale: 1.0                    # multiplies the installed onshore+offshore capacity baseline below
  hub_height_m: 150             # height of the wind_speed_hub_ms output column -- set to YOUR
                                 # turbine's hub height (default 150 if omitted; null = no column).
                                 # Typical: onshore 4-6 MW ~100-130, offshore 8-11 MW ~110-140,
                                 # 14-15 MW ~140-150, 20-22 MW ~160-170. Use wind_speed_hub_ms, not
                                 # the 10 m wind_speed_ms, for turbine power/energy. Both are Horns
                                 # Rev (Danish North Sea, offshore) wind: representative for DK1
                                 # offshore farms, not for a specific onshore site.
  # capacity baseline (MW, as of 2026-06-01, source: Energinet CapacityPerMunicipality)
  onshore_capacity_mw: 4162.6
  offshore_capacity_mw: 2661.7

# Optional: wind at a wind-farm site, for evaluating a farm there (e.g. in WinPACT).
# The site needs a fitted model in data/sites/<name>.json -- shipped: thor (offshore),
# ringkobing (onshore, coast), herning (onshore, inland). Add your own via
# config/sites.yaml (see its header).
# Output column: site_wind_speed_hub_ms. Remove this block to leave it out.
site:
  name: thor
  hub_height_m: 150

solar:
  scale: 1.0                    # multiplies the installed solar capacity baseline below
  # capacity baseline (MW, as of 2026-06-01, source: Energinet CapacityPerMunicipality)
  capacity_mw: 3881.1
  # WARNING: the price model is in-domain only up to ~1.25x (wind.scale and
  # solar.scale, alone or together). Beyond that, aggregate statistics are usable
  # with caution but individual hours are extrapolated; beyond ~2x results are
  # outside the validated region, and beyond ~3x the price response saturates and
  # capture rates stop falling -- see README "Known limitations".

gas:
  mode: "trajectory"             # [flat, trajectory]
  flat:
    regime: "post_crisis"        # [pre_crisis, crisis, post_crisis, custom]
    custom_eur_mwh: 40.0          # used only if regime: "custom"
  trajectory:
    # Sums to the 5-year horizon: ramps into a crisis and back out. The validation
    # printout reports Spearman(wind, price) per regime as well as overall, since
    # pooling regimes with different price levels dilutes it. Segments past
    # horizon_hours are ignored; a schedule shorter than it holds the last level.
    segments:
      - {regime: "post_crisis", years: 1}
      - {regime: "crisis", years: 1}
      - {regime: "post_crisis", years: 3}
    ramp_hours: 720                # linear ramp duration between regimes (hours)
    noise_std: 3.0                 # AR(1) noise, stationary std (EUR/MWh)
    noise_ar: 0.99                 # AR(1) coefficient
    noise_floor: 10.0              # hard floor (EUR/MWh)

paths:
  fitted_models_dir: "models/"
  data_dir: "data/"
  output_dir: "outputs/"
